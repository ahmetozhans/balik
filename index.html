<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111b29"><title>Mera · Kıyı Avı Rehberi</title><link rel="manifest" href="app.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="brand" href="./"><img src="icon.svg" alt=""> Mera</a><span class="edition">Marmara · Kıyı avı</span></header>
<nav aria-label="Sayfalar"><button data-view="today" aria-current="page"><span aria-hidden="true">◉</span>Bugün</button><button data-view="plan"><span aria-hidden="true">▦</span>7 Gün</button><button data-view="spots"><span aria-hidden="true">⌖</span>Meralar</button><button data-view="fish"><span aria-hidden="true">≋</span>Balıklar</button><button data-view="log"><span aria-hidden="true">▤</span>Av Defteri</button></nav>
<div class="row filters"><label>Mera<select id="spot"></select></label><label>Hedef tür<select id="species"></select></label></div>
<p id="status" role="status" class="muted"></p>
<section id="today"><h1>Bugünkü av tahmini</h1><div id="today-content"></div></section>
<section id="plan" hidden><h1>7 günlük plan</h1><div id="plan-content"></div><div class="card"><h2>Mera karşılaştır</h2><div class="compare-controls"><label>İkinci mera<select id="compare-spot"></select></label><button id="compare-button">Karşılaştır</button></div><div id="compare-result" aria-live="polite"></div></div></section>
<section id="spots" hidden><h1>Meralarım</h1><div class="card"><iframe class="map" id="map" title="Seçili meranın haritası" loading="lazy"></iframe><p><a id="map-link" target="_blank" rel="noopener">Haritada aç</a></p><p class="muted">Haritadan koordinatı bulup aşağıya ekleyebilir veya telefonunun konumunu kullanabilirsin.</p><button id="gps" type="button">Konumumu al</button><p id="gps-status" role="status"></p><form id="spot-form"><label>Mera adı<input name="name" maxlength="70" required></label><div class="row"><label>Enlem<input name="lat" type="number" min="-90" max="90" step="any" required></label><label>Boylam<input name="lon" type="number" min="-180" max="180" step="any" required></label></div><button class="primary">Merayı kaydet</button></form></div></section>
<section id="fish" hidden><h1>Balık rehberi</h1><label>Sezon takvimi<select id="season"><option value="">Tüm aylar</option></select></label><div id="fish-content"></div></section>
<section id="log" hidden><h1>Av defteri</h1><form id="log-form" class="card"><label>Tarih ve saat<input name="date" type="datetime-local" required></label><label>Balık<select name="fish" id="log-fish"></select></label><label>Adet<input name="count" type="number" min="0" max="999" value="0" required></label><label>Yem<input name="bait" maxlength="100"></label><label>Av notu<textarea name="note" maxlength="500"></textarea></label><label>Fotoğraf<input name="photo" type="file" accept="image/*"></label><button class="primary">Avı kaydet</button><p id="log-status" role="status"></p></form><div id="log-stats"></div><div id="log-content"></div></section>
</main><script src="app.js" defer></script></body></html>
