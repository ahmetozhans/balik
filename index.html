<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102c2d"><title>Mera · Kıyı Avı Rehberi</title><link rel="manifest" href="app.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<style>
:root{color-scheme:dark;--bg:#102c2d;--panel:#193b3c;--ink:#f3f0df;--muted:#b6cebf;--lime:#d8ef9a;--line:#426261}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}main{width:min(100% - 32px,760px);margin:auto;padding:32px 0 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font:700 36px Georgia,serif;letter-spacing:-1px}.muted,small{color:var(--muted)}nav,.row{display:flex;flex-wrap:wrap;gap:8px}nav{margin-bottom:16px}button,select,input,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}button{cursor:pointer}button[aria-current],.primary{background:var(--lime);color:#18291b;border-color:var(--lime);font-weight:700}article,.card,details{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}h1,h2,h3,p{margin:0 0 10px}h1{font:700 clamp(27px,7vw,44px) Georgia,serif}h2{font-size:20px}h3{font-size:17px}label{display:grid;gap:6px;margin:9px 0}input,select,textarea{max-width:100%;min-width:0}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid var(--line)}.scroll{overflow-x:auto}a{color:var(--lime)}.score{font-size:28px;color:var(--lime)}.entry-photo{display:block;max-width:100%;max-height:220px;border-radius:8px;margin:10px 0}.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}.map{width:100%;height:270px;border:0;border-radius:12px}summary{cursor:pointer}[hidden]{display:none!important}
</style></head>
<body><main><header><div class="brand">Mera</div><span class="muted">Kıyı avı rehberi</span></header>
<nav aria-label="Sayfalar"><button data-view="today" aria-current="page">Bugün</button><button data-view="plan">7 Gün</button><button data-view="spots">Meralar</button><button data-view="fish">Balıklar</button><button data-view="log">Av Defteri</button></nav>
<div class="row"><label>Mera<select id="spot"></select></label><label>Hedef tür<select id="species"></select></label></div>
<p id="status" role="status" class="muted"></p>
<section id="today"><h1>Bugünkü av tahmini</h1><div id="today-content"></div></section>
<section id="plan" hidden><h1>7 günlük plan</h1><div id="plan-content"></div></section>
<section id="spots" hidden><h1>Meralarım</h1><div class="card"><iframe class="map" id="map" title="Seçili meranın haritası" loading="lazy"></iframe><p><a id="map-link" target="_blank" rel="noopener">Haritada aç</a></p><p class="muted">Haritadan koordinatı bulup aşağıya ekleyebilir veya telefonunun konumunu kullanabilirsin.</p><button id="gps" type="button">Konumumu al</button><p id="gps-status" role="status"></p><form id="spot-form"><label>Mera adı<input name="name" maxlength="70" required></label><div class="row"><label>Enlem<input name="lat" type="number" min="-90" max="90" step="any" required></label><label>Boylam<input name="lon" type="number" min="-180" max="180" step="any" required></label></div><button class="primary">Merayı kaydet</button></form></div></section>
<section id="fish" hidden><h1>Balık rehberi</h1><div id="fish-content"></div></section>
<section id="log" hidden><h1>Av defteri</h1><form id="log-form" class="card"><label>Tarih ve saat<input name="date" type="datetime-local" required></label><label>Balık<select name="fish" id="log-fish"></select></label><label>Adet<input name="count" type="number" min="0" max="999" value="0" required></label><label>Yem<input name="bait" maxlength="100"></label><label>Av notu<textarea name="note" maxlength="500"></textarea></label><label>Fotoğraf<input name="photo" type="file" accept="image/*"></label><button class="primary">Avı kaydet</button><p id="log-status" role="status"></p></form><div id="log-content"></div></section>
</main><script src="app.js" defer></script></body></html>
